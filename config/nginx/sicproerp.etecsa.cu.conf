
upstream odoo {
    server 127.0.0.1:8069;
}

upstream odoochat {
    server 127.0.0.1:8072;
}

server {
    listen 80;
    listen [::]:80;

    server_name sicproerp.dvpe.etecsa.cu;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name sicproerp.dvpe.etecsa.cu;

    access_log /opt/odoo/sicproerp-data/log/nginx/dominio/sicproerp_access.log combined buffer=16k flush=5s;
    error_log  /opt/odoo/sicproerp-data/log/nginx/dominio/sicproerp_error.log warn;

    ssl_certificate /etc/nginx/ssl/sicpro.crt;
    ssl_certificate_key /etc/nginx/ssl/sicpro.key;

    ssl_session_timeout 60m;
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    ssl_prefer_server_ciphers off;

    proxy_buffering on;
    proxy_buffers 16 64k;
    proxy_buffer_size 64k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 128k;

    location /websocket {
        proxy_pass http://odoochat;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }

    location /web/database/backup {
        proxy_pass http://odoo;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;

        proxy_buffering off;
    }

    location /web/database/restore {
        proxy_pass http://odoo;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        client_max_body_size 5G;
        client_body_timeout 3600s;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_request_buffering on;
    }

    location / {
        proxy_pass http://odoo;
        proxy_redirect off;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 60s;
        proxy_read_timeout 720s;
        proxy_send_timeout 720s;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;

    gzip_types
        text/css
        text/scss
        text/plain
        text/xml
        application/xml
        application/json
        application/javascript
        application/xml+rss
        text/javascript;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}

