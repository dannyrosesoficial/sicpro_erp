<t>
    <t t-call="master_input" />

    <div class="row mb-3">
        <label for="dbname" class="col-md-4 col-form-label">Nombre de la Base de Datos</label>
        <div class="col-md-8">
            <input id="dbname" type="text" name="name" class="form-control" required="required" autocomplete="off" t-att-pattern="pattern" title="Solo se permiten caracteres alfanuméricos, guiones bajos, guiones y puntos"/>
        </div>
    </div>

    <div class="row mb-3">
        <label for="login" class="col-md-4 col-form-label">Correo Electrónico</label>
        <div class="col-md-8">
            <input id="login" type="text" name="login" class="form-control" required="required" placeholder="admin@ejemplo.com" autocomplete="off"/>
        </div>
    </div>

    <div class="row mb-3">
        <label for="password" class="col-md-4 col-form-label">Contraseña</label>
        <div class="col-md-8">
            <div class="input-group">
                <input id="password" type="password" name="password" class="form-control" required="required" autocomplete="off"/>
                <span class="fa fa-eye o_little_eye input-group-text" aria-hidden="true" style="cursor: pointer;"></span>
            </div>
        </div>
    </div>

    <div class="row mb-3">
        <label for="phone" class="col-md-4 col-form-label">Número de Teléfono</label>
        <div class="col-md-8">
            <input id="phone" type="tel" name="phone" class="form-control" placeholder="+53" autocomplete="off"/>
        </div>
    </div>

    <div class="row mb-3">
        <label for="lang" class="col-md-4 col-form-label">Idioma</label>
        <div class="col-md-8">
            <select id="lang" name="lang" class="form-select" required="required" autocomplete="off">
                <t t-foreach="langs" t-as="lang">
                    <t t-if="lang[0] == 'es_CU' or lang[0] == 'es_ES'">
                        <option t-att-value="lang[0]" t-out="lang[1]" selected="selected"/>
                    </t>
                    <t t-else="">
                        <option t-att-value="lang[0]" t-out="lang[1]"/>
                    </t>
                </t>
            </select>
        </div>
    </div>

    <div class="row mb-3">
        <label for="country" class="col-md-4 col-form-label">País</label>
        <div class="col-md-8">
            <select id="country" name="country_code" class="form-select" autocomplete="off">
                <option value=""></option>
                <t t-foreach="countries" t-as="country">
                    <t t-if="country[0] == 'CU'">
                        <option t-att-value="country[0]" t-out="country[1]" selected="selected"/>
                    </t>
                    <t t-else="">
                        <option t-att-value="country[0]" t-out="country[1]"/>
                    </t>
                </t>
            </select>
        </div>
    </div>

    <div class="row mb-3">
        <label for="load_demo_checkbox" class="col-md-4 col-form-label">Datos de Prueba</label>
        <div class="col-md-8 d-flex align-items-center">
            <input type="checkbox" id="load_demo_checkbox" class="form-check-input mt-0" name="demo" value="1" />
            <small class="text-muted ms-2">(Carga registros ficticios para explorar Odoo)</small>
        </div>
    </div>
</t>
